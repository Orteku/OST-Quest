<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- El enlace lleva un token secreto: ni indexar ni mandarlo como referer a otras webs -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Nueva contraseña — Oesti Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="48x48" href="img/logo.png">
  <!-- Sin AdSense en esta página: verían la URL con el token -->
  <script>
    // Se guarda el token y se quita de la barra de direcciones antes de cargar nada más
    window.RESET_TOKEN = new URLSearchParams(location.search).get('token') || '';
    if (location.search) history.replaceState(null, '', location.pathname);
  </script>
</head>
<body>
<script>if(localStorage.getItem('ostquest_theme')==='light')document.body.classList.add('theme--light');</script>

<div class="site-header-wrap" id="site-header">
  </div><!-- /.site-header-wrap -->

<div class="app-wrapper">

  <div id="site-controls"></div>

  <div class="reset-card" id="reset-card">
    <h2 class="auth-title" data-i18n="reset_title">Nueva contraseña</h2>
    <p class="auth-forgot-text" data-i18n="reset_text">Elige la contraseña nueva para tu cuenta.</p>
    <div class="auth-form" id="reset-form">
      <input class="auth-input" type="password" id="reset-pwd" autocomplete="new-password"
             placeholder="Nueva contraseña" data-i18n-placeholder="auth_new_password">
      <input class="auth-input" type="password" id="reset-pwd2" autocomplete="new-password"
             placeholder="Confirmar contraseña" data-i18n-placeholder="auth_confirm_password">
      <p class="auth-err" id="auth-err" style="display:none"></p>
      <button class="btn auth-submit-btn" id="reset-submit" data-i18n="reset_btn">Guardar contraseña</button>
    </div>
  </div>

  <footer class="site-footer" id="site-footer" style="margin-top:32px"></footer>

</div>

<div id="modal" role="dialog" aria-modal="true">
  <div id="modal-inner"></div>
</div>
<div id="auth-modal" role="dialog" aria-modal="true">
  <div id="auth-modal-inner"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/specials.js"></script>
<script src="js/achievements.js"></script>
<script src="js/daily.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script>siteAuthReady.then(initResetPasswordPage);</script>
</body>
</html>
