<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ranking de jugadores de Oesti Quest — clasificación semanal y global.">
  <title>Ranking — Oesti Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="48x48" href="img/logo.png">
  <style>
    .ranking-page {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .ranking-page__title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: #b8e030;
      margin-bottom: 16px;
    }
    .ranking-page .rank-tabs { margin-bottom: 12px; }
    .ranking-page .rank-content { overflow: visible; }

    body.theme--light .ranking-page__title { color: #4a6c10; }
  </style>
</head>
<body>
<script>if(localStorage.getItem('ostquest_theme')==='light')document.body.classList.add('theme--light');</script>
<script>window.RANKING_PAGE = true;</script>

<noscript>
  <div style="max-width:560px;margin:3rem auto;padding:1.5rem;font-family:system-ui,sans-serif;color:#ddd9cf;text-align:center">
    <h1>Ranking — Oesti Quest</h1>
    <p style="margin-top:.75rem;color:#888">Activa JavaScript para ver el ranking.</p>
  </div>
</noscript>

<div class="site-header-wrap" id="site-header">
  </div><!-- /.site-header-wrap -->

<div class="app-wrapper">

  <div id="site-controls"></div>

  <div class="ranking-page">
    <h1 class="ranking-page__title" data-i18n="ranking_title">Ranking</h1>

    <div class="rank-tabs">
      <button class="rank-tab rank-tab--active" id="rtab-weekly" data-i18n="ranking_weekly">Esta semana</button>
      <button class="rank-tab" id="rtab-global" data-i18n="ranking_global">Global</button>
    </div>

    <div id="ranking-list" class="rank-content"><!-- RANKING_START -->
<p class="rank-empty">Cargando ranking...</p>
<!-- RANKING_END --></div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

</div>

<div id="auth-modal" role="dialog" aria-modal="true">
  <div id="auth-modal-inner"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/specials.js"></script>
<script src="js/achievements.js"></script>
<script src="js/daily.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script src="js/ranking.js"></script>
</body>
</html>
