<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Herramienta interna (rol GM): que no aparezca en buscadores -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Bestiario — Oesti Quest</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111316;
      --panel: #1a1d22;
      --panel2: #232731;
      --text: #eef0f4;
      --muted: #a9b0bd;
      --line: #333846;
      --accent: #28d7e8;
      --danger: #ff6666;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 19, 22, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: .2px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, input, select, textarea {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 650;
    }
    button.primary {
      background: var(--accent);
      color: #031013;
      border-color: transparent;
    }
    button.danger {
      background: #3b1f24;
      color: #ffd9df;
      border-color: #76333f;
    }
    button.success {
      background: #27a048;
      color: #fff;
      border-color: transparent;
    }
    img.cover-preview { cursor: zoom-in; }
    .btn-group {
      display: flex;
      gap: 4px;
      background: rgba(40, 215, 232, 0.08);
      border: 1px solid rgba(40, 215, 232, 0.2);
      border-radius: 10px;
      padding: 4px;
    }
    #custom-confirm {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    #custom-confirm-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 420px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    #custom-confirm-msg {
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
    }
    #custom-confirm-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: zoom-out;
    }
    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.8);
    }
    .scroll-btns {
      position: fixed;
      bottom: 78px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }
    .scroll-btns button {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    input[type="file"] { max-width: 290px; }
    #search {
      min-width: 0;
    }
    main {
      padding: 16px;
      max-width: 1700px;
      margin: 0 auto;
    }
    code { color: #d8e3ff; }
    .info {
      color: var(--muted);
      margin: 10px 0 14px;
      line-height: 1.45;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
    }
    .pill {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
    }
    .pill strong { color: var(--text); }
    .pill.warn { border-color: #ffd166; color: #ffe7a0; }
    .search-stats {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
      padding: 0 2px;
    }
    .search-stats strong { color: var(--text); }
    .pagination-bar { display:flex; align-items:center; gap:8px; padding:6px 16px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; position:sticky; top:var(--header-h, 0px); z-index:9; }
    .pagination-bar button { padding:4px 10px; font-size:12px; }
    .pagination-bar button:disabled { opacity:0.35; cursor:default; pointer-events:none; }
    .pg-icon { width:28px; height:28px; padding:0; font-size:16px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
    #pageInfo, #pageInfo2 { color:var(--muted); white-space:nowrap; }
    #pageRange, #pageRange2 { color:var(--muted); margin-left:auto; white-space:nowrap; }
    .list {
      display: grid;
      gap: 10px;
    }
    .row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      align-items: start;
      min-height: 140px;
    }
    .list.filtering .row.hidden { display: none; }
    .cover-box {
      display: grid;
      gap: 6px;
    }
    .cover-preview {
      width: 130px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #080a0d;
      border: 1px solid #2b303b;
      border-radius: 8px;
    }
    .cover-preview.missing {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
      object-fit: unset;
    }
    .meta {
      display: grid;
      gap: 8px;
    }
    .titleline {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .game-title {
      font-weight: 800;
      font-size: 16px;
      line-height: 1.25;
      flex: 1;
    }
    .row-id {
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }
    .meta-fields {
      display: grid;
      grid-template-columns: 1fr 1fr auto 68px 52px;
      gap: 8px;
      align-items: end;
    }
    .yt-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 65px auto;
      gap: 8px;
      align-items: end;
    }
    .yt-row > label { min-width: 0; }
    .yt-row input { width: 100%; min-width: 0; }
    .url-wrap { position: relative; }
    .url-wrap input { padding-right: 28px; }
    .url-wrap .mp3-link { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: auto; height: auto; }
    input[data-field="startSeconds"], #newStart { width: 65px; min-width: 0; }
    .track-block { display: flex; flex-direction: column; gap: 4px; }
    .track-block + .track-block { margin-top: 6px; }
    .track-block--extra { position: relative; }
    .track-block--extra > button.danger { position: absolute; left: -34px; top: 0; }
    .track-title-input { width: 100%; min-width: 0; font-size: 13px; }
    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }
    label span { padding-left: 2px; }
    .field-youtube, .field-cover {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .game-input { width: 100%; }
    .meta-fields input { width: 100%; min-width: 0; }
    .meta-fields > button { white-space: nowrap; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .small {
      font-size: 12px;
      padding: 6px 8px;
    }
    .cover-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      align-self: center;
      justify-self: start;
    }
    .cover-link:hover { text-decoration: underline; }
    .mp3-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      line-height: 1;
    }
    .mp3-link[href] { color: var(--accent); cursor: pointer; }
    .mp3-link[href]:hover { opacity: 0.75; }
    button.btn-playing { background: #22c55e; border-color: #22c55e; color: #000; }
    .track-btns { display: flex; gap: 4px; align-items: end; }
    .meta-fields select, .year-input { width: 100%; min-width: 0; }
    .compact select { padding: 6px 8px; }
    input.field-error { border-color: var(--danger) !important; }
    input.field-warn  { border-color: var(--warn) !important; }
    .compact .row {
      grid-template-columns: 96px 1fr;
      padding: 8px;
      gap: 8px;
    }
    .compact .cover-preview { width: 86px; border-radius: 7px; }
    .compact .meta-fields { gap: 6px; }
    .compact input { padding: 6px 8px; }
    .add-panel {
      margin: 16px 0;
      background: #15191f;
      border: 1px dashed #485061;
      border-radius: 12px;
      padding: 12px;
      display: none;
    }
    .add-panel.open { display: block; }
    .add-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-row1 {
      display: grid;
      grid-template-columns: 1fr 1fr 68px 52px;
      gap: 8px;
      align-items: end;
    }
    .add-row2 { display: flex; flex-direction: column; gap: 6px; }
    .add-track-row1 { display: flex; align-items: flex-end; gap: 8px; }
    .add-track-row1 > label:not(.lyrics-check) { flex: 1; min-width: 0; }
    .add-track-row1 input:not([type="checkbox"]) { width: 100%; }
    .add-track-row2 { display: grid; grid-template-columns: minmax(0,1fr) 65px auto; gap: 8px; align-items: end; }
    .add-track-row2 label { min-width: 0; }
    .add-track-row2 input { width: 100%; min-width: 0; }
    .add-row1 input { width: 100%; min-width: 0; }
    .track-header { display: flex; align-items: flex-end; gap: 8px; }
    .track-header > label:first-child { flex: 1; min-width: 0; }
    .lyrics-check { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; padding-bottom: 8px; font-weight: normal; }
    .lyrics-check input[type="checkbox"] { cursor: pointer; accent-color: var(--accent); margin: 0; width: auto; height: auto; padding: 0; border: none; border-radius: 0; background: none; }
    .tags-row { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
    .track-block .tags-row { margin-top: 0; }
    .tags-input { width: 100%; }
    .tag-suggestions { display: flex; flex-wrap: wrap; gap: 4px; min-height: 4px; }
    .tag-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; color: var(--muted); line-height: 1.6; user-select: none; }
    .tag-chip.active { background: rgba(40,215,232,0.12); border-color: var(--accent); color: var(--accent); }
    .tag-chip:hover { border-color: var(--muted); }
    .footer-space { height: 88px; }
    .global-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      display: none;
      align-items: center;
      gap: 14px;
      padding: 0 16px 0 12px;
      z-index: 60;
      backdrop-filter: blur(8px);
    }
    .global-player.active { display: flex; }
    .gp-locator {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px 8px;
      margin: -4px -8px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .gp-locator:hover { background: var(--panel2); }
    .gp-cover {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .gp-info {
      min-width: 0;
      flex: 0 0 200px;
    }
    .gp-game {
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gp-track {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #gpAudio {
      flex: 1;
      min-width: 200px;
      max-width: 700px;
      accent-color: var(--accent);
    }
    #gpClose {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    #gpClose:hover { color: var(--text); background: var(--panel2); }
    .notice {
      border-left: 4px solid var(--warn);
      background: #211d12;
      padding: 10px 12px;
      color: #ffe7a0;
      border-radius: 8px;
      margin: 10px 0;
    }
    .sheets-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0 2px;
      border-top: 1px solid var(--line);
      margin-top: 8px;
    }
    .sheets-panel.open { display: flex; }
    .sheets-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .gm-login-input { width: 190px; font-size: 13px; }
    body:not(.gm-on) .gm-only { display: none !important; }
    .header-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .header-title { display: flex; align-items: center; gap: 10px; }
    .gm-account { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .gm-account-row { display: inline-flex; align-items: center; gap: 8px; }
    .header-links { display: flex; gap: 6px; }
    .tab-tools { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
    .tab-tools.active { display: flex; }
    .tools-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tools-row .btn-group { margin: 0; }
    .tab-tools .sheets-panel { margin-top: 0; }
    .save-wrap { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
    .pending-summary { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .pending-summary:empty { display: none; }
    .sheets-label { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 80px; }
    .sheets-url-input { flex: 1; min-width: 300px; font-size: 13px; }
    .sheets-status { font-size: 12px; color: var(--muted); }
    .sheets-status.ok    { color: #6bc832; }
    .sheets-status.error { color: var(--danger); }
    @media (max-width: 900px) {
      .meta-fields {
        grid-template-columns: 1fr 1fr 68px 52px;
      }
      .meta-fields > button[data-action="reloadCover"] { display: none; }
    }
    @media (max-width: 720px) {
      .row, .compact .row {
        grid-template-columns: 1fr;
      }
      .cover-box {
        display: grid;
        grid-template-columns: 90px 1fr;
        align-items: center;
        gap: 10px;
      }
      .meta-fields {
        grid-template-columns: 1fr 68px 52px;
      }
      .meta-fields > label:nth-child(2) { grid-column: 1 / -1; }
      .add-row1 { grid-template-columns: 1fr 68px 52px; }
      .add-track-row1 { flex-wrap: wrap; }
      .add-track-row2 { grid-template-columns: 1fr 65px; }
    }
    /* ── Tabs ──────────────────────────────── */
    .tab-bar { display: flex; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 8px; }
    .tab-btn { background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 16px; border-radius: 8px; font-weight: 650; }
    .tab-btn.active { background: var(--panel2); border-color: var(--line); color: var(--text); }
    .tab-btn:hover:not(.active) { color: var(--text); background: var(--panel); }
    .tab-btn.tab-diff::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 5px; vertical-align: middle; position: relative; top: -1px; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    /* ── Traducciones ─────────────────────── */
    .trans-list { display: grid; gap: 4px; }
    .trans-row { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
    .trans-id { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; padding-right: 4px; }
    .trans-original { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trans-input { font-size: 13px; width: 100%; }
    /* ── Especiales ───────────────────────── */
    .special-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .special-card-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .special-color { width: 38px; height: 34px; padding: 2px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
    .special-date { width: 130px; font-family: ui-monospace, monospace; font-size: 13px; }
    .special-date-sep { color: var(--muted); }
    .date-combo { position: relative; display: inline-flex; align-items: center; }
    .date-combo .special-date { padding-right: 30px; }
    .date-pick-btn { position: absolute; right: 2px; width: 26px; height: 26px; padding: 0; border: none; background: transparent; font-size: 14px; line-height: 1; cursor: pointer; opacity: .7; }
    .date-pick-btn:hover { opacity: 1; }
    .date-picker-hidden { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
    .special-name { width: 140px; }
    .special-label { flex: 1; min-width: 120px; }
    .special-card-body { display: flex; flex-direction: column; gap: 10px; }
    .special-field-row { display: flex; gap: 8px; align-items: flex-start; }
    .special-field-label { color: var(--muted); font-size: 12px; padding-top: 10px; width: 64px; flex-shrink: 0; }
    .special-gameids { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; }
    .special-gameid-preview { display: flex; flex-wrap: wrap; gap: 4px; min-height: 4px; }
    .sp-id-search { flex: 1; min-width: 260px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sp-id-results { display: flex; flex-wrap: wrap; gap: 4px; max-height: 160px; overflow-y: auto; }
    .sp-id-results:empty { display: none; }
    .sp-id-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); cursor: pointer; user-select: none; }
    .sp-id-chip:hover { border-color: var(--accent); color: var(--accent); }
    .sp-id-chip strong { color: var(--text); }
  </style>
</head>
<body data-tab="db">
<header>
  <div class="header-top">
    <div class="header-title">
      <a href="/" style="color:var(--accent);text-decoration:none;font-size:26px;line-height:1">←</a>
      <h1 style="margin:0">Bestiario</h1>
    </div>
    <!-- Acceso con una cuenta de Oesti Quest con rol GM: el worker hace las lecturas y escrituras -->
    <div class="gm-account">
      <span id="gmLoginRow" class="gm-account-row">
        <input id="gmLogin" class="gm-login-input" placeholder="Email o nombre de usuario" autocomplete="username" />
        <input id="gmPassword" class="gm-login-input" type="password" placeholder="Contraseña" autocomplete="current-password" />
        <button id="gmLoginBtn" class="primary">Entrar</button>
      </span>
      <span id="gmSessionRow" class="gm-account-row" style="display:none">
        <span class="sheets-label">Cuenta GM:</span>
        <span id="gmUser"></span>
        <button id="gmLogoutBtn">Salir</button>
      </span>
      <span id="gmStatus" class="sheets-status"></span>
    </div>
    <div class="header-links">
      <a href="/?gm" target="_blank" rel="noopener" style="background:#d4a017;color:#1a1400;border:none;border-radius:8px;padding:7px 12px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;font-size:14px">Modo GM</a>
      <a href="https://www.youtube.com" target="_blank" rel="noopener" style="background:#ff0000;color:#fff;border:none;border-radius:8px;padding:7px 12px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;font-size:14px">YouTube</a>
      <a href="https://www.igdb.com" target="_blank" rel="noopener" style="background:#8c44b0;color:#fff;border:none;border-radius:8px;padding:7px 12px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;font-size:14px">IGDB</a>

<script>
(() => {
  let db = [];
  let dirty = false;
  let compact = false;
  let originalFilename = "database.js";

  const $ = (id) => document.getElementById(id);
  const list = $("list");

  function customConfirm(msg, { ok = "Aceptar", cancel = "Cancelar", okDanger = false } = {}) {
    return new Promise(resolve => {
      $("custom-confirm-msg").textContent = msg;
      const btns = $("custom-confirm-btns");
      btns.innerHTML = "";
      const cancelBtn = document.createElement("button");
      cancelBtn.textContent = cancel;
      cancelBtn.onclick = () => { $("custom-confirm").style.display = "none"; resolve(false); };
      const okBtn = document.createElement("button");
      okBtn.textContent = ok;
      okBtn.className = okDanger ? "danger" : "primary";
      okBtn.onclick = () => { $("custom-confirm").style.display = "none"; resolve(true); };
      btns.append(cancelBtn, okBtn);
      $("custom-confirm").style.display = "flex";
      okBtn.focus();
    });
  }

  let _diffTimer = null;
  function setDirty(value = true) {
    dirty = value;
    $("dirtyPill").style.display = dirty ? "" : "none";
    if (typeof updateDbPending === "function") {
      clearTimeout(_diffTimer);
      _diffTimer = setTimeout(updateDbPending, 400);
    }
    if (typeof setTabDiff === "function") {
      if (value) setTabDiff('db', true);
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function jsString(value) {
    return String(value ?? "")
      .replaceAll("\\", "\\\\")
      .replaceAll('"', '\\"');
  }

  function cleanUrl(value) {
    return String(value || "").trim();
  }

  function trackSourceVal(track) {
    return track.mp3Url || '';
  }

  function normalizeAudioUrl(url) {
    return url.replace('archive.org/details/', 'archive.org/download/');
  }

  function tracksSectionHtml(tracks) {
    const rows = tracks.map((track, ti) => {
      const srcVal   = escapeHtml(trackSourceVal(track));
      const stVal    = escapeHtml(secondsToTime(track.startSeconds));
      const titleVal  = escapeHtml(track.title || "");
      const artistVal = escapeHtml(track.artist || "");
      const isFirst = ti === 0;
      const removeBtn = isFirst ? '' : `<button class="small danger" data-action="removeTrack" data-track="${ti}">✕</button>`;
      const titleLabel = `<div class="track-header">
          <label style="flex:1;min-width:0"><span>Canción</span><input class="track-title-input" data-field="title" data-track="${ti}" placeholder="Canción (opcional)" value="${titleVal}" /></label>
          <label style="flex:1;min-width:0"><span>Artista</span><input data-field="artist" data-track="${ti}" placeholder="Artista (opcional)" value="${artistVal}" /></label>
        </div>`;
      const mp3Link = `<a class="mp3-link" data-mp3link="${ti}"${track.mp3Url ? ` href="${escapeHtml(track.mp3Url)}" target="_blank" rel="noopener" title="abrir MP3"` : ''}>↗</a>`;
      const srcRow = `<div class="yt-row">
          <label><div class="url-wrap"><input class="field-youtube" data-field="source" data-track="${ti}" placeholder="URL del MP3…" value="${srcVal}" />${mp3Link}</div></label>
          <label><input class="field-youtube" placeholder="0:00" data-field="startSeconds" data-track="${ti}" value="${stVal}" /></label>
          <div class="track-btns" data-track="${ti}"><button class="small" data-action="loadTrack" data-track="${ti}">▶ Cargar</button></div>
        </div>`;
      const trackTagsRow = `<div class="tags-row">
          <label><input class="tags-input" data-field="trackTags" data-track="${ti}" value="${escapeHtml((track.tags || []).join(', '))}" placeholder="tags..." /></label>
          <div class="tag-suggestions">${trackTagSuggestionsHtml(track.tags || [])}</div>
        </div>`;
      return `<div class="track-block${isFirst ? '' : ' track-block--extra'}">${removeBtn}${titleLabel}${srcRow}${trackTagsRow}</div>`;
    }).join("");
    return rows + `<button class="small" data-action="addTrack" style="margin-top:6px">+</button>`;
  }

  function parseGameDb(text) {
    let src = String(text || "").trim();

    try {
      const parsed = JSON.parse(src);
      if (Array.isArray(parsed)) return parsed;
      if (Array.isArray(parsed.GAME_DB)) return parsed.GAME_DB;
    } catch {}

    const assignIndex = src.search(/\bGAME_DB\b\s*=/);
    let arrayText = "";
    if (assignIndex >= 0) {
      const after = src.slice(assignIndex);
      const bracketStart = after.indexOf("[");
      if (bracketStart < 0) throw new Error("No encuentro '[' después de GAME_DB =");
      arrayText = extractBalanced(after.slice(bracketStart), "[", "]");
    } else {
      const bracketStart = src.indexOf("[");
      if (bracketStart >= 0) arrayText = extractBalanced(src.slice(bracketStart), "[", "]");
      else arrayText = "[" + src + "]";
    }

    const arr = Function(`"use strict"; return (${arrayText});`)();
    if (!Array.isArray(arr)) throw new Error("GAME_DB no es un array");
    return arr;
  }

  function extractBalanced(s, open, close) {
    let depth = 0, quote = null, escape = false;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (quote) {
        if (escape) { escape = false; continue; }
        if (ch === "\\") { escape = true; continue; }
        if (ch === quote) quote = null;
        continue;
      }
      if (ch === '"' || ch === "'" || ch === "`") { quote = ch; continue; }
      if (ch === open) depth++;
      if (ch === close) {
        depth--;
        if (depth === 0) return s.slice(0, i + 1);
      }
    }
    throw new Error("No se pudo cerrar el array GAME_DB");
  }

  function normalizeTracks(x) {
    const norm = t => ({
      title:        String(t.title ?? "").trim(),
      artist:       String(t.artist ?? "").trim(),
      mp3Url:       String(t.mp3Url ?? t.url ?? "").trim(),
      startSeconds: Math.max(0, Number(t.startSeconds) || 0),
      tags:         Array.isArray(t.tags) ? t.tags.map(String).filter(Boolean) : [],
    });
    if (Array.isArray(x.tracks) && x.tracks.length > 0) return x.tracks.map(norm);
    return [norm(x)];
  }

  function normalizeDb(arr) {
    return arr.map((x, idx) => ({
      id:        Number(x.id) || idx + 1,
      game:      String(x.game ?? "").trim(),
      cover:     cleanUrl(x.cover ?? ""),
      developer: String(x.developer ?? "").trim(),
      tracks:    normalizeTracks(x),
      pop:       Number(x.pop) || 1,
      year:      Number(x.year) || 0,
      tags:      Array.isArray(x.tags) ? x.tags.map(String).filter(Boolean) : [],
    }));
  }

  function getAllTags() {
    const set = new Set();
    db.forEach(item => (item.tags || []).forEach(t => set.add(t)));
    return [...set].sort();
  }

  function tagSuggestionsHtml(activeTags) {
    const all = getAllTags();
    if (!all.length) return '';
    return all.map(tag => {
      const active = activeTags.includes(tag);
      return `<span class="tag-chip${active ? ' active' : ''}" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</span>`;
    }).join('');
  }

  function getAllTrackTags() {
    const set = new Set();
    db.forEach(item => item.tracks.forEach(t => (t.tags || []).forEach(tag => set.add(tag))));
    return [...set].sort();
  }

  function trackTagSuggestionsHtml(activeTags) {
    const all = getAllTrackTags();
    if (!all.length) return '';
    return all.map(tag => {
      const active = activeTags.includes(tag);
      return `<span class="tag-chip${active ? ' active' : ''}" data-tag="${escapeHtml(tag)}" data-track-tag>${escapeHtml(tag)}</span>`;
    }).join('');
  }

  function secondsToTime(s) {
    const total = Math.max(0, Number(s) || 0);
    const m = Math.floor(total / 60);
    const sec = total % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function timeToSeconds(val) {
    const s = String(val || "").trim();
    if (s.includes(":")) {
      const [m, sec] = s.split(":");
      return Math.max(0, (parseInt(m, 10) || 0) * 60 + (parseInt(sec, 10) || 0));
    }
    return Math.max(0, Number(s) || 0);
  }

  const IMAGE_EXT_RE = /\.(jpe?g|png|webp|gif|svg|avif|bmp|tiff?)(\?|#|$)/i;
  const AUDIO_EXT_RE = /\.(mp3|m4a|ogg|flac|wav|aac|opus|wma|mp4)(\?|#|$)/i;

  function isValidUrl(url)      { return /^https?:\/\//i.test(url); }
  function isValidImageUrl(url) { return !url || (isValidUrl(url) && IMAGE_EXT_RE.test(url)); }
  function isValidAudioUrl(url) { return !url || (isValidUrl(url) && AUDIO_EXT_RE.test(url)); }

  // Índices para duplicate-check O(1) en lugar de O(n)
  let _coverIdx = new Map();   // url → Set<dbIndex>
  let _audioIdx = new Map();   // url → Set<dbIndex>
  let _gyIdx    = new Map();   // "game\0year" → Set<dbIndex>

  function _addToIdx(map, key, i)   { if (!key) return; if (!map.has(key)) map.set(key, new Set()); map.get(key).add(i); }
  function _delFromIdx(map, key, i) { const s = map.get(key); if (!s) return; s.delete(i); if (!s.size) map.delete(key); }
  function _gyKey(g, y)             { return g && y ? `${String(g).toLowerCase()}\0${Number(y)}` : ''; }

  function rebuildIndexes() {
    _coverIdx.clear(); _audioIdx.clear(); _gyIdx.clear();
    db.forEach((item, i) => {
      _addToIdx(_coverIdx, item.cover, i);
      item.tracks.forEach(t => _addToIdx(_audioIdx, t.mp3Url, i));
      _addToIdx(_gyIdx, _gyKey(item.game, item.year), i);
    });
  }

  function isCoverDuplicate(url, excludeIdx) {
    if (!url) return false;
    const s = _coverIdx.get(url);
    return !!s && (s.size > 1 || !s.has(excludeIdx));
  }
  function isAudioDuplicate(url, excludeIdx) {
    if (!url) return false;
    const s = _audioIdx.get(url);
    return !!s && (s.size > 1 || !s.has(excludeIdx));
  }
  function isGameYearDuplicate(game, year, excludeIdx) {
    const key = _gyKey(game, year);
    if (!key) return false;
    const s = _gyIdx.get(key);
    return !!s && (s.size > 1 || !s.has(excludeIdx));
  }

  function validateCoverInput(input, url, excludeIdx) {
    const invalid = Boolean(url) && !isValidImageUrl(url);
    input.classList.toggle('field-error', invalid);
    input.classList.toggle('field-warn', !invalid && isCoverDuplicate(url, excludeIdx));
    return !invalid;
  }
  function validateAudioInput(input, url, excludeIdx, warnEmpty = true) {
    const invalid = Boolean(url) && !isValidAudioUrl(url);
    input.classList.toggle('field-error', invalid);
    input.classList.toggle('field-warn', !invalid && ((warnEmpty && !url) || isAudioDuplicate(url, excludeIdx)));
    return !invalid;
  }
  function validateGameYearInputs(gameInput, yearInput, game, year, excludeIdx, checkEmpty = true) {
    const emptyGame = checkEmpty && !String(game).trim();
    const emptyYear = checkEmpty && !Number(year);
    const dupl = !emptyGame && isGameYearDuplicate(game, year, excludeIdx);
    gameInput.classList.toggle('field-error', emptyGame);
    gameInput.classList.toggle('field-warn', !emptyGame && dupl);
    yearInput.classList.toggle('field-warn', emptyYear || dupl);
  }

  function validateRow(row, item, index) {
    const coverInput = row.querySelector('input[data-field="cover"]');
    if (coverInput) validateCoverInput(coverInput, item.cover, index);
    item.tracks.forEach((track, ti) => {
      const srcInput = row.querySelector(`input[data-field="source"][data-track="${ti}"]`);
      if (srcInput) validateAudioInput(srcInput, track.mp3Url, index);
      if (ti > 0) {
        const titleInput = row.querySelector(`input[data-field="title"][data-track="${ti}"]`);
        if (titleInput) titleInput.classList.toggle('field-warn', !track.title.trim());
      }
    });
    const gameInput = row.querySelector('input[data-field="game"]');
    const yearInput = row.querySelector('[data-field="year"]');
    if (gameInput && yearInput) validateGameYearInputs(gameInput, yearInput, item.game, item.year, index);
  }

  // Revalida solo los rows con índices afectados — O(k) en vez de O(n)
  function revalidateByIndices(indices, field) {
    indices.forEach(idx => {
      const row = list.querySelector(`.row[data-index="${idx}"][data-filled]`);
      if (!row) return;
      const item = db[idx];
      if (field === 'cover') {
        const inp = row.querySelector('input[data-field="cover"]');
        if (inp) validateCoverInput(inp, item.cover, idx);
      } else if (field === 'audio') {
        item.tracks.forEach((track, ti) => {
          const inp = row.querySelector(`input[data-field="source"][data-track="${ti}"]`);
          if (inp) validateAudioInput(inp, track.mp3Url, idx);
        });
      } else if (field === 'gameyear') {
        const gi = row.querySelector('input[data-field="game"]');
        const yi = row.querySelector('[data-field="year"]');
        if (gi && yi) validateGameYearInputs(gi, yi, item.game, item.year, idx);
      }
    });
  }

  function updateStats() {
    const total   = db.length;
    const q       = $("search").value.trim();
    const visible = _filteredIndices !== null ? _filteredIndices.length : total;
    $("searchStats").textContent = total === 0 ? "" : q ? `${visible} de ${total}` : `${total} entradas`;
  }

  function coverHtml(item) {
    if (!item.cover) {
      return `<div class="cover-preview missing">Sin cover</div>`;
    }
    return `<img class="cover-preview" src="${escapeHtml(item.cover)}" alt="Cover de ${escapeHtml(item.game)}" loading="lazy"
      onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'cover-preview missing', textContent:'Cover no carga'}));" />`;
  }

  function buildRowContent(item) {
    return `
      <div class="cover-box">
        <div class="cover-holder">${coverHtml(item)}</div>
        ${item.cover ? `<a class="cover-link" target="_blank" rel="noopener" href="${escapeHtml(item.cover)}">abrir cover ↗</a>` : `<span class="cover-link" style="color:var(--muted)">sin cover</span>`}
      </div>
      <div class="meta">
        <div class="titleline">
          <span class="row-id">#${escapeHtml(item.id)}</span>
          <span class="game-title">${escapeHtml(item.game || "(sin título)")}</span>
          <button class="small" data-action="duplicate">Duplicar</button>
          <button class="small danger" data-action="delete">Eliminar</button>
        </div>
        <div class="meta-fields">
          <label><span>Juego</span><input class="game-input" data-field="game" value="${escapeHtml(item.game)}" /></label>
          <label><span>Cover URL</span><input class="field-cover" data-field="cover" value="${escapeHtml(item.cover)}" placeholder="https://..." /></label>
          <button class="small" data-action="reloadCover">↺ Cover</button>
          <label><span>Año</span><input class="year-input" data-field="year" list="yearOptions" inputmode="numeric" maxlength="4" autocomplete="off" value="${escapeHtml(item.year || '')}" /></label>
          <label><span>Pop</span><input type="number" min="1" max="6" step="1" data-field="pop" value="${escapeHtml(item.pop)}" /></label>
          <label style="grid-column:1/-1"><span>Desarrollador</span><input data-field="developer" value="${escapeHtml(item.developer || '')}" placeholder="Estudio o publisher (opcional)" /></label>
        </div>
        <div class="tags-row">
          <label><span>Tags</span><input class="tags-input field-youtube" data-field="tags" value="${escapeHtml((item.tags || []).join(', '))}" placeholder="rpg, action..." /></label>
          <div class="tag-suggestions">${tagSuggestionsHtml(item.tags || [])}</div>
        </div>
        <div class="tracks-section">${tracksSectionHtml(item.tracks)}</div>
      </div>
    `;
  }

  function rowSearchAttrs(item) {
    return {
      'data-search': `${item.game} ${item.developer || ""} ${item.tracks.map(t => `${t.title} ${t.mp3Url} ${t.artist} ${(t.tags||[]).join(" ")}`).join(" ")} ${item.cover} ${item.year} ${item.pop} ${(item.tags||[]).join(" ")}`.toLowerCase(),
      'data-sg':   item.game.toLowerCase(),
      'data-st':   item.tracks.map(t => `${t.title} ${t.artist}`).join(" ").toLowerCase(),
      'data-stag': `${(item.tags||[]).join(" ")} ${item.tracks.map(t => (t.tags||[]).join(" ")).join(" ")}`.toLowerCase(),
      'data-sy':   String(item.year),
      'data-su':   item.tracks.map(t => t.mp3Url).join(" ").toLowerCase(),
      'data-sar':  item.tracks.map(t => t.artist || "").join(" ").toLowerCase(),
    };
  }

  // ── Paginación ───────────────────────────────────────────────────────────
  const PAGE_SIZE = 50;
  let _page = 0;
  let _filteredIndices = null; // null = sin filtro (todos)
  let _searchIndex = [];       // rowSearchAttrs pre-computado por índice de db

  function updatePaginationBar(totalVisible, totalPages) {
    const display  = db.length === 0 ? 'none' : '';
    const prevDis  = _page === 0;
    const nextDis  = _page >= totalPages - 1;
    const infoText = totalPages > 1 ? `Página ${_page + 1} de ${totalPages}` : '';
    const start    = _page * PAGE_SIZE + 1;
    const end      = Math.min((_page + 1) * PAGE_SIZE, totalVisible);
    const rangeText = totalVisible === 0 ? 'Sin resultados'
      : totalVisible <= PAGE_SIZE ? `${totalVisible} entradas`
      : `${start}–${end} de ${totalVisible}`;
    for (const s of ['', '2']) {
      $("paginationBar" + s).style.display = display;
      $("firstPage"     + s).disabled      = prevDis;
      $("prevPage"      + s).disabled      = prevDis;
      $("nextPage"      + s).disabled      = nextDis;
      $("lastPage"      + s).disabled      = nextDis;
      $("pageInfo"      + s).textContent   = infoText;
      $("pageRange"     + s).textContent   = rangeText;
    }
  }

  function renderPage() {
    if (_rowObserver) { _rowObserver.disconnect(); _rowObserver = null; }
    const all   = _filteredIndices !== null ? _filteredIndices : db.map((_, i) => i);
    const total = all.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    _page = Math.min(_page, pages - 1);
    const slice = all.slice(_page * PAGE_SIZE, (_page + 1) * PAGE_SIZE);
    list.innerHTML = slice.map(index => {
      const a = _searchIndex[index] || rowSearchAttrs(db[index]);
      return `<article class="row" data-index="${index}" data-search="${escapeHtml(a['data-search'])}" data-sg="${escapeHtml(a['data-sg'])}" data-st="${escapeHtml(a['data-st'])}" data-stag="${escapeHtml(a['data-stag'])}" data-sy="${escapeHtml(a['data-sy'])}" data-su="${escapeHtml(a['data-su'])}" data-sar="${escapeHtml(a['data-sar'])}"></article>`;
    }).join('');
    _rowObserver = new IntersectionObserver(
      (entries) => { entries.forEach(e => { if (e.isIntersecting) fillRow(e.target); }); },
      { rootMargin: '500px 0px' }
    );
    list.querySelectorAll('.row').forEach(row => _rowObserver.observe(row));
    updatePaginationBar(total, pages);
  }

  function updateRowSearch(row, index) {
    const attrs = rowSearchAttrs(db[index]);
    _searchIndex[index] = attrs;
    for (const [k, v] of Object.entries(attrs)) row.setAttribute(k, v);
  }

  let _rowObserver = null;

  function fillRow(row) {
    if (row.dataset.filled) return;
    row.dataset.filled = "1";
    const index = Number(row.dataset.index);
    row.innerHTML = buildRowContent(db[index]);
    validateRow(row, db[index], index);
    if (_rowObserver) _rowObserver.unobserve(row);
  }

  function fillAllRows() {
    list.querySelectorAll(".row:not([data-filled])").forEach(fillRow);
  }

  function render() {
    document.body.classList.toggle("compact", compact);
    _page = 0;
    _filteredIndices = null;
    list.classList.remove("filtering");
    _searchIndex = db.map(item => rowSearchAttrs(item));
    renderPage();
    rebuildIndexes();
    applySearch();
    updateStats();
  }

  function updateItemFromInput(input) {
    const row = input.closest(".row");
    const index = Number(row.dataset.index);
    const field = input.dataset.field;

    if (field === "trackTags") {
      const ti = Number(input.dataset.track);
      const track = db[index].tracks[ti];
      track.tags = input.value.split(',').map(t => t.trim()).filter(Boolean);
      const suggestions = input.closest('.tags-row')?.querySelector('.tag-suggestions');
      if (suggestions) suggestions.innerHTML = trackTagSuggestionsHtml(track.tags);
      updateRowSearch(row, index);
      setDirty(true);
      return;
    }

    const trackIdx = input.dataset.track !== undefined ? Number(input.dataset.track) : null;
    let value = input.value;

    if (trackIdx !== null) {
      const track = db[index].tracks[trackIdx];
      if (field === "source") {
        const oldAudioUrl = track.mp3Url;
        const oldAudioRows = new Set(_audioIdx.get(oldAudioUrl) || []);
        track.mp3Url = normalizeAudioUrl(value);
        input.value  = track.mp3Url;
        const loadBtn = row.querySelector(`button[data-action="loadTrack"][data-track="${trackIdx}"]`);
        if (loadBtn) { loadBtn.textContent = "▶ Cargar"; loadBtn.disabled = false; }
        const mp3LinkEl = row.querySelector(`[data-mp3link="${trackIdx}"]`);
        if (mp3LinkEl) {
          const newA = document.createElement('a');
          newA.className = 'mp3-link';
          newA.dataset.mp3link = String(trackIdx);
          if (track.mp3Url) {
            newA.href = track.mp3Url;
            newA.target = '_blank';
            newA.rel = 'noopener';
            newA.title = 'abrir MP3';
          }
          newA.textContent = '↗';
          mp3LinkEl.replaceWith(newA);
        }
        _delFromIdx(_audioIdx, oldAudioUrl, index);
        _addToIdx(_audioIdx, track.mp3Url, index);
        revalidateByIndices(new Set([...oldAudioRows, ...(_audioIdx.get(track.mp3Url) || []), index]), 'audio');
      } else if (field === "startSeconds") {
        track.startSeconds = timeToSeconds(value);
        input.value = secondsToTime(track.startSeconds);
        const loadBtn = row.querySelector(`button[data-action="loadTrack"][data-track="${trackIdx}"]`);
        if (loadBtn) { loadBtn.textContent = "▶ Cargar"; loadBtn.disabled = false; }
      } else if (field === "title") {
        track.title = value;
        if (trackIdx > 0) input.classList.toggle('field-warn', !value.trim());
      } else if (field === "artist") {
        track.artist = value;
      }
    } else {
      if (field === "tags") {
        db[index].tags = value.split(',').map(t => t.trim()).filter(Boolean);
        const suggestions = row.querySelector('.tag-suggestions');
        if (suggestions) suggestions.innerHTML = tagSuggestionsHtml(db[index].tags);
      } else if (field === "cover") {
        const oldCoverUrl = db[index].cover;
        const oldCoverRows = new Set(_coverIdx.get(oldCoverUrl) || []);
        const newCoverUrl = cleanUrl(value);
        db[index].cover = newCoverUrl;
        input.value = newCoverUrl;
        reloadRowCover(row);
        _delFromIdx(_coverIdx, oldCoverUrl, index);
        _addToIdx(_coverIdx, newCoverUrl, index);
        revalidateByIndices(new Set([...oldCoverRows, ...(_coverIdx.get(newCoverUrl) || []), index]), 'cover');
      } else {
        if (field === "year" && !/^\d{4}$/.test(String(value).trim())) { input.value = db[index].year || ""; return; }
        if (["pop", "year"].includes(field)) value = Number(value) || 0;
        if (field === "pop") value = Math.max(1, Math.min(6, value));
        const oldGyKey  = (field === "game" || field === "year") ? _gyKey(db[index].game, db[index].year) : null;
        const oldGyRows = oldGyKey ? new Set(_gyIdx.get(oldGyKey) || []) : null;
        db[index][field] = value;
        if (field === "game") {
          const title = row.querySelector(".game-title");
          if (title) title.textContent = value || "(sin título)";
        }
        if (oldGyKey !== null) {
          const newKey = _gyKey(db[index].game, db[index].year);
          _delFromIdx(_gyIdx, oldGyKey, index);
          _addToIdx(_gyIdx, newKey, index);
          revalidateByIndices(new Set([...oldGyRows, ...(_gyIdx.get(newKey) || []), index]), 'gameyear');
        }
      }
    }

    updateRowSearch(row, index);
    setDirty(true);
    updateStats();
  }

  function stopAllMedia() {
    $("gpAudio").pause();
  }

  let _gpIndex = -1;
  let _activePlayContainer = null; // .track-btns div del track en reproducción
  let _activeSimpleBtn = null;     // botón suelto (formulario nueva entrada)

  function clearActivePlayBtn() {
    if (_activeSimpleBtn) {
      _activeSimpleBtn.textContent = "▶ Cargar";
      _activeSimpleBtn.disabled = false;
      _activeSimpleBtn = null;
    }
    if (!_activePlayContainer) return;
    const ti = _activePlayContainer.dataset.track;
    _activePlayContainer.innerHTML = `<button class="small" data-action="loadTrack" data-track="${ti}">▶ Cargar</button>`;
    _activePlayContainer = null;
  }

  function loadTrackInPlayer(track, gameName, coverUrl, element) {
    if (!track?.mp3Url) return;
    clearActivePlayBtn();
    stopAllMedia();

    const isContainer = element?.classList?.contains('track-btns');
    if (isContainer) {
      _activePlayContainer = element;
      element.innerHTML = `<button class="small" disabled>Cargando…</button>`;
    } else {
      _activeSimpleBtn = element || null;
      if (element) { element.textContent = "Cargando…"; element.disabled = true; }
    }

    const audio = $("gpAudio");
    $("gpGame").textContent = gameName;
    $("gpTrack").textContent = track.title || "";
    const gpCover = $("gpCover");
    if (coverUrl) { gpCover.src = coverUrl; gpCover.style.display = ""; }
    else gpCover.style.display = "none";

    audio.src = track.mp3Url;
    $("globalPlayer").classList.add("active");

    const onError = () => { clearActivePlayBtn(); };

    audio.addEventListener('loadedmetadata', () => {
      if (track.startSeconds > 0) audio.currentTime = track.startSeconds;
    }, { once: true });
    audio.addEventListener('canplay', () => {
      if (!isContainer && element) { element.textContent = "▶ Cargar"; element.disabled = false; _activeSimpleBtn = null; }
      audio.play().catch(onError);
    }, { once: true });
    audio.addEventListener('error', onError, { once: true });
    audio.load();
  }

  function loadInGlobalPlayer(index, ti, btn) {
    _gpIndex = index;
    const item = db[index];
    const track = item.tracks[ti];
    loadTrackInPlayer(track, item.game, item.cover, btn.closest('.track-btns') ?? btn);
  }

  function reloadRowCover(row) {
    const index = Number(row.dataset.index);
    const holder = row.querySelector(".cover-holder");
    const link = row.querySelector(".cover-link");
    if (holder) holder.innerHTML = coverHtml(db[index]);
    if (link) {
      if (db[index].cover) {
        link.textContent = "abrir cover ↗";
        link.href = db[index].cover;
        link.style.color = "";
      } else {
        link.textContent = "sin enlace";
        link.removeAttribute("href");
        link.style.color = "var(--muted)";
      }
    }
  }

  list.addEventListener("change", (e) => {
    if (e.target.matches("input[data-field], select[data-field]")) updateItemFromInput(e.target);
  });

  list.addEventListener("keydown", (e) => {
    if (e.target.matches("input[data-field]") && e.key === "Enter") e.target.blur();
  });

  list.addEventListener("click", (e) => {
    const cover = e.target.closest("img.cover-preview");
    if (cover) {
      $("lightboxImg").src = cover.src;
      $("lightbox").style.display = "flex";
      return;
    }

    const chip = e.target.closest(".tag-chip");
    if (chip) {
      const row = chip.closest(".row");
      const index = Number(row.dataset.index);
      const tag = chip.dataset.tag;
      if ("trackTag" in chip.dataset) {
        const tagsInput = chip.closest('.tags-row')?.querySelector('input[data-field="trackTags"]');
        if (tagsInput) {
          const ti = Number(tagsInput.dataset.track);
          const track = db[index].tracks[ti];
          const tags = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
          if (tags.includes(tag)) {
            const newTags = tags.filter(t => t !== tag);
            tagsInput.value = newTags.join(', ');
            track.tags = newTags;
            chip.classList.remove('active');
          } else {
            tags.push(tag);
            tagsInput.value = tags.join(', ');
            track.tags = tags;
            chip.classList.add('active');
          }
          updateRowSearch(row, index);
          setDirty(true);
        }
      } else {
        const tagsInput = row.querySelector('input[data-field="tags"]');
        if (tagsInput) {
          const tags = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
          if (tags.includes(tag)) {
            const newTags = tags.filter(t => t !== tag);
            tagsInput.value = newTags.join(', ');
            db[index].tags = newTags;
            chip.classList.remove('active');
          } else {
            tags.push(tag);
            tagsInput.value = tags.join(', ');
            db[index].tags = tags;
            chip.classList.add('active');
          }
          updateRowSearch(row, index);
          setDirty(true);
        }
      }
      return;
    }

    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const row = btn.closest(".row");
    const index = Number(row.dataset.index);
    const action = btn.dataset.action;

    if (action === "loadTrack" || action === "reloadTrack") {
      const ti = Number(btn.dataset.track || 0);
      loadInGlobalPlayer(index, ti, btn);
    } else if (action === "togglePlay") {
      const audio = $("gpAudio");
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    } else if (action === "reloadCover") {
      reloadRowCover(row);
    } else if (action === "addTrack") {
      db[index].tracks.push({ title: "", mp3Url: "", startSeconds: 0 });
      setDirty(true);
      row.querySelector(".tracks-section").innerHTML = tracksSectionHtml(db[index].tracks);
    } else if (action === "removeTrack") {
      const ti = Number(btn.dataset.track);
      if (db[index].tracks.length > 1) {
        const track = db[index].tracks[ti];
        const doRemove = () => {
          _delFromIdx(_audioIdx, track.mp3Url, index);
          db[index].tracks.splice(ti, 1);
          setDirty(true);
          row.querySelector(".tracks-section").innerHTML = tracksSectionHtml(db[index].tracks);
          validateRow(row, db[index], index);
        };
        if (track.mp3Url || track.title) {
          customConfirm(`¿Eliminar la canción "${track.title || 'sin título'}"?`, { ok: "Eliminar", okDanger: true }).then(ok => { if (ok) doRemove(); });
        } else {
          doRemove();
        }
      }
    } else if (action === "duplicate") {
      const maxId = db.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
      db.splice(index + 1, 0, { ...db[index], id: maxId + 1, game: db[index].game + " (copia)", tracks: db[index].tracks.map(t => ({ ...t })) });
      setDirty(true);
      render();
    } else if (action === "delete") {
      customConfirm(`¿Eliminar "${db[index].game}"?`, { ok: "Eliminar", okDanger: true }).then(ok => {
        if (!ok) return;
        db.splice(index, 1);
        setDirty(true);
        render();
      });
    }
  });

  const SEARCH_ATTR = { all: 'data-search', game: 'data-sg', tracks: 'data-st', artist: 'data-sar', tags: 'data-stag', year: 'data-sy', url: 'data-su' };

  function applySearch() {
    const q = $("search").value.trim().toLowerCase();
    if (!q) {
      _filteredIndices = null;
      list.classList.remove("filtering");
    } else {
      const attr      = SEARCH_ATTR[$("searchField").value] || 'data-search';
      const emptyMode = q === '<empty>';
      list.classList.add("filtering");
      _filteredIndices = db.reduce((acc, _, i) => {
        const hay   = (_searchIndex[i]?.[attr] || '').trim();
        const match = emptyMode ? hay === '' : q.split(/\s+/).every(w => hay.includes(w));
        if (match) acc.push(i);
        return acc;
      }, []);
    }
    _page = 0;
    renderPage();
    updateStats();
  }

  $("search").addEventListener("input", () => {
    $("searchClear").style.display = $("search").value ? "" : "none";
    applySearch();
  });
  $("searchClear").addEventListener("click", () => {
    $("search").value = "";
    $("searchClear").style.display = "none";
    applySearch();
  });
  $("searchField").addEventListener("change", applySearch);

  $("dbUpload").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    loadText(await file.text(), file.name);
    e.target.value = "";
  });

  function refreshNewTagSuggestions() {
    const active = $("newTags").value.split(',').map(t => t.trim()).filter(Boolean);
    $("newTagSuggestions").innerHTML = tagSuggestionsHtml(active);
  }

  function refreshNewTrackTagSuggestions() {
    const active = [...$("newTrackTagSuggestions").querySelectorAll('.tag-chip.active')].map(c => c.dataset.tag);
    $("newTrackTagSuggestions").innerHTML = getAllTrackTags().map(tag => {
      const isActive = active.includes(tag);
      return `<span class="tag-chip${isActive ? ' active' : ''}" data-tag="${escapeHtml(tag)}" data-track-tag>${escapeHtml(tag)}</span>`;
    }).join('');
  }

  $("newTrackTagSuggestions").addEventListener("click", (e) => {
    const chip = e.target.closest(".tag-chip");
    if (!chip) return;
    chip.classList.toggle("active");
  });

  $("newTagSuggestions").addEventListener("click", (e) => {
    const chip = e.target.closest(".tag-chip");
    if (!chip) return;
    const tag = chip.dataset.tag;
    const tags = $("newTags").value.split(',').map(t => t.trim()).filter(Boolean);
    if (tags.includes(tag)) {
      $("newTags").value = tags.filter(t => t !== tag).join(', ');
      chip.classList.remove('active');
    } else {
      tags.push(tag);
      $("newTags").value = tags.join(', ');
      chip.classList.add('active');
    }
  });

  $("newTags").addEventListener("change", refreshNewTagSuggestions);

  function validateNewForm() {
    validateCoverInput($("newCover"), $("newCover").value.trim(), -1);
    validateAudioInput($("newMp3Url"), $("newMp3Url").value.trim(), -1, false);
    validateGameYearInputs($("newGame"), $("newYear"), $("newGame").value.trim(), Number($("newYear").value) || 0, -1, false);
  }
  ["newCover", "newMp3Url", "newGame", "newYear"].forEach(id => $(id).addEventListener("change", validateNewForm));

  (function() {
    const dl = document.createElement('datalist');
    dl.id = 'yearOptions';
    for (let y = new Date().getFullYear() + 1; y >= 1970; y--) { const o = document.createElement('option'); o.value = y; dl.appendChild(o); }
    document.body.appendChild(dl);
    $("newYear").value = new Date().getFullYear();
  })();

  // Con datalist el navegador filtra las opciones por el texto del campo; se vacía al enfocar
  // para que el desplegable muestre todos los años, y se restaura al salir sin cambios.
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (!el.classList?.contains("year-input")) return;
    el.dataset.prev = el.value;
    el.placeholder = el.value;
    el.value = "";
  });
  document.addEventListener("focusout", e => {
    const el = e.target;
    if (!el.classList?.contains("year-input")) return;
    if (!/^\d{4}$/.test(el.value.trim())) el.value = el.dataset.prev || "";
    el.placeholder = "";
  });

  $("toggleAdd").addEventListener("click", () => {
    $("addPanel").classList.toggle("open");
    refreshNewTagSuggestions();
    refreshNewTrackTagSuggestions();
    $("newGame").focus();
  });

  $("clearNew").addEventListener("click", () => {
    $("newGame").value = "";
    $("newCover").value = "";
    $("newDeveloper").value = "";
    $("newTitle").value = "";
    $("newArtist").value = "";
    $("newTrackTagSuggestions").querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    $("newMp3Url").value = "";
    $("newStart").value = "0:00";

  function toJs() {
    const lines = db.map(item => {
      const coverPart     = item.cover      ? ` cover: "${jsString(item.cover)}",`                          : "";
      const developerPart = item.developer  ? ` developer: "${jsString(item.developer)}",`                  : "";
      const tagsPart      = item.tags?.length ? ` tags: [${item.tags.map(t => `'${jsString(t)}'`).join(', ')}],` : "";
      const tracksPart = item.tracks.map(t => {
        const p = [];

  function extractSheetId(urlOrId) {

  function normalizeSheetKeys(obj) {
    const map = {
      startseconds: "startSeconds", start_seconds: "startSeconds", "start seconds": "startSeconds",
      start: "startSeconds", inicio: "startSeconds",
      mp3url: "mp3Url", mp3: "mp3Url", url: "mp3Url",
      popularidad: "pop", popularity: "pop",
      juego: "game", "año": "year", ano: "year", portada: "cover",
    };
    const result = {};
    for (const [k, v] of Object.entries(obj)) {
      result[map[k] ?? k] = v;
    }
    return result;
  }

      if (data.status !== "ok") throw new Error(data.errors?.[0]?.message || "Error de Google Sheets");

  // ── Supabase ──────────────────────────────────────────────────────────────

  // El editor no habla con Supabase directamente: lo hace el worker, solo para cuentas con rol GM.
  // La sesión de GM dura 12 horas y no sirve para el juego (ni la del juego para el editor).
  const GM_API       = "https://auth.oestiquest.com";
  const GM_TOKEN_KEY = "ostquest_gm_token";
  const GM_USER_KEY  = "ostquest_gm_user";
  // Antes se guardaba aquí la URL y la clave de Supabase: ya no se usan y no deben quedarse en el navegador
  localStorage.removeItem("ostquest_supabase");

  // Milisegundos de la caducidad del token (campo exp del JWT), o 0 si no se puede leer
  function gmTokenExpiry(token) {
    try {
      const b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return (JSON.parse(atob(b64)).exp || 0) * 1000;
    } catch { return 0; }
  }

  let _gmExpiryTimer = null;
  function updateGmSession() {
    const token = localStorage.getItem(GM_TOKEN_KEY);
    if (token && gmTokenExpiry(token) <= Date.now()) {
      localStorage.removeItem(GM_TOKEN_KEY);
      localStorage.removeItem(GM_USER_KEY);
    }
    const user = localStorage.getItem(GM_USER_KEY);
    const on   = !!localStorage.getItem(GM_TOKEN_KEY);
    clearTimeout(_gmExpiryTimer);
    // setTimeout no admite más de ~24,8 días; la sesión dura 12 h
    if (on) _gmExpiryTimer = setTimeout(updateGmSession, Math.min(gmTokenExpiry(token) - Date.now() + 1000, 2 ** 31 - 1));
    document.body.classList.toggle("gm-on", on);
    $("gmLoginRow").style.display   = on ? "none" : "";
    $("gmSessionRow").style.display = on ? "" : "none";
    $("gmUser").textContent = user || "";
  }
  function clearGmSession() {
    localStorage.removeItem(GM_TOKEN_KEY);
    localStorage.removeItem(GM_USER_KEY);
    updateGmSession();
  }
  updateGmSession();
  // Los temporizadores se congelan con el equipo suspendido: se revisa al volver a la pestaña
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateGmSession(); });

  // path: ruta del worker; body: si se pasa, la petición es POST con ese JSON
  async function gmApi(path, body) {
    const token = localStorage.getItem(GM_TOKEN_KEY);
    if (!token) {
      $("gmLogin").focus();
      throw new Error("Entra con tu cuenta GM (arriba)");
    }
    const res = await fetch(GM_API + path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 403) {
      clearGmSession();
      $("gmLogin").focus();
      throw new Error(data.error === "not_gm" ? "Esta cuenta ya no es GM" : "La sesión de GM ha caducado: vuelve a entrar");
    }
    if (!res.ok) throw new Error(data.message || data.error || `Error ${res.status}`);
    return data;
  }

  async function gmLogin() {
    const status = $("gmStatus");
    const login = $("gmLogin").value.trim();
    const password = $("gmPassword").value;
    if (!login || !password) return;
    status.textContent = "Entrando..."; status.className = "sheets-status";
    try {
      const res = await fetch(GM_API + "/gm/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error({
          invalid_credentials: "Usuario o contraseña incorrectos",
          not_gm:              "Esta cuenta no tiene el rol GM",
          too_many_attempts:   "Demasiados intentos: espera un minuto",
        }[data.error] || data.error || `Error ${res.status}`);
      }
      localStorage.setItem(GM_TOKEN_KEY, data.token);
      localStorage.setItem(GM_USER_KEY, data.username || login);
      $("gmPassword").value = "";
      updateGmSession();
      status.textContent = "✓ Sesión de GM iniciada"; status.className = "sheets-status ok";
    } catch (err) {
      status.textContent = "Error: " + err.message; status.className = "sheets-status error";
    }
  }

  // ── Guardar en Supabase: sube lo nuevo y lo modificado y borra lo quitado ─────
  // La referencia es lo que había en Supabase al cargar (no lo que hay al guardar): así no se borra
  // lo que otra persona haya añadido mientras tanto.

  let _supaBaseline = null;  // id → JSON de la entrada tal como está en Supabase

  function setSupaBaseline(data) {
    _supaBaseline = new Map(data.map(item => [item.id, JSON.stringify(item)]));
    updateDbPending();
  }

  function getSupaDiff() {
    if (!_supaBaseline) return null;
    const newEntries = [], modifiedEntries = [];
    const ids = new Set();
    for (const item of db) {
      ids.add(item.id);
      if (!_supaBaseline.has(item.id)) newEntries.push(item);
      else if (_supaBaseline.get(item.id) !== JSON.stringify(item)) modifiedEntries.push(item);
    }
    const deletedIds = [..._supaBaseline.keys()].filter(id => !ids.has(id));
    return { newEntries, modifiedEntries, deletedIds };
  }

  // "3 nuevos · 5 modificados · 1 eliminado"; vacío si no hay nada cargado
  function pendingText(added, modified, deleted) {
    const part = (n, one, many) => n ? `${n} ${n === 1 ? one : many}` : null;
    const parts = [part(added, "nuevo", "nuevos"), part(modified, "modificado", "modificados"), part(deleted, "eliminado", "eliminados")].filter(Boolean);
    return parts.length ? parts.join(" · ") : "Sin cambios";
  }

  function updateDbPending() {
    const d = getSupaDiff();
    $("dbPending").textContent = d ? pendingText(d.newEntries.length, d.modifiedEntries.length, d.deletedIds.length) : "";
  }

  // Lista legible de lo que se va a borrar, para el aviso
  function namesList(names) {
    return names.slice(0, 10).join(", ") + (names.length > 10 ? ` y ${names.length - 10} más` : "");
  }

  $("dbSave").addEventListener("click", async () => {
    const status = $("dbStatus");
    if (db.length === 0) {
      status.textContent = "No hay datos cargados.";
      status.className = "sheets-status error";
      return;
    }
    try {
      if (!_supaBaseline) {
        status.textContent = "Comprobando...";
        status.className = "sheets-status";
        setSupaBaseline(normalizeDb(await gmApi("/gm/games")));
      }
      const { newEntries, modifiedEntries, deletedIds } = getSupaDiff();
      if (!newEntries.length && !modifiedEntries.length && !deletedIds.length) {
        status.textContent = "No hay cambios que guardar";
        status.className = "sheets-status";
        return;
      }
      if (deletedIds.length) {
        const names = deletedIds.map(id => JSON.parse(_supaBaseline.get(id)).game || `#${id}`);
        if (!await customConfirm(`Se eliminarán ${deletedIds.length} juego(s) de Supabase: ${namesList(names)}.`, { ok: "Guardar y eliminar", okDanger: true })) {
          status.textContent = "";
          return;
        }
      }
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
      download(`database-${stamp}.js`, toJs(), "text/javascript;charset=utf-8");
      status.textContent = "Guardando...";
      status.className = "sheets-status";
      const rows = [...newEntries, ...modifiedEntries];
      await gmApi("/gm/games/upsert", { rows, deleteIds: deletedIds });
      rows.forEach(item => _supaBaseline.set(item.id, JSON.stringify(item)));
      deletedIds.forEach(id => _supaBaseline.delete(id));
      updateDbPending();
      status.textContent = `✓ Guardado: ${pendingText(newEntries.length, modifiedEntries.length, deletedIds.length)}`;
      status.className = "sheets-status ok";
    } catch (err) {
      status.textContent = "Error: " + err.message;
      status.className = "sheets-status error";
      console.error(err);
    }
  });

    const headers = ["id", "game", "cover", "pop", "year", "tracks"];
    const escape = val => {
      const s = String(val ?? "");

        ? `"${s.replace(/"/g, '""')}"` : s;

      if (field === "color") {
        const card = el.closest('.special-card');
        if (card) card.style.borderLeftColor = el.value;
      }
    }
    setSpecialsDirty(true);
  });

  $("specialsList").addEventListener("change", e => {
    const picker = e.target.closest(".date-picker-hidden");
    if (!picker || !picker.value) return;
    const text = picker.closest(".date-combo").querySelector(".special-date");
    // si el campo estaba en formato anual (MM-DD), se conserva anual
    text.value = /^\d{2}-\d{2}$/.test(text.value.trim()) ? picker.value.slice(5) : picker.value;
    text.dispatchEvent(new Event("input", { bubbles: true }));
  });

  $("specialsList").addEventListener("click", e => {
    const pick = e.target.closest("[data-action='pickDate']");
    if (pick) {
      const combo  = pick.closest(".date-combo");
      const text   = combo.querySelector(".special-date").value.trim();
      const picker = combo.querySelector(".date-picker-hidden");
      const year   = new Date().getFullYear();
      picker.value = /^\d{4}-\d{2}-\d{2}$/.test(text) ? text
                   : /^\d{2}-\d{2}$/.test(text)       ? `${year}-${text}`
                   : '';
      try { picker.showPicker(); } catch { picker.focus(); picker.click(); }
      return;
    }
    const btn = e.target.closest("[data-action='removeSpecial']");
    if (btn) {
      const i = Number(btn.dataset.index);
      customConfirm(`¿Eliminar el evento "${_specials[i]?.label || 'sin nombre'}"?`, { ok: 'Eliminar', okDanger: true }).then(ok => {
        if (!ok) return;
        _specials.splice(i, 1);
        setSpecialsDirty(true);
        renderSpecials();
      });
      return;
    }
    const chip = e.target.closest('[data-sp-tag]');
    if (chip) {
      const tag = chip.dataset.spTag;
      const i = Number(chip.dataset.index);
      if (!_specials[i]) return;
      _specials[i].tag = _specials[i].tag === tag ? '' : tag;
      setSpecialsDirty(true);
      renderSpecials();
    }
  });

  $("specialsAdd").addEventListener("click", () => {
    _specials.push({ date: '', label: '', name: '', color: '#888888', tag: '', gameIds: [], search: '' });
    setSpecialsDirty(true);
    renderSpecials();
    requestAnimationFrame(() => {
      const cards = $("specialsList").querySelectorAll('.special-card');
      if (cards.length) cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });

  $("specialsLoad").addEventListener("click", async () => {
    const status = $("specialsStatus");
    status.textContent = 'Cargando...'; status.className = 'sheets-status';
    try {
      const data = await gmApi('/gm/specials');
      _specials = (data || []).map(parseSpecialFromRow);
      setSpecialsBaseline(_specials);
      _specialsLoaded = true;
      setSpecialsDirty(false);
      status.textContent = `✓ ${_specials.length} eventos cargados`;
      status.className = 'sheets-status ok';
      renderSpecials();
      checkSpecialsDiff();
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
      status.className = 'sheets-status error';
      console.error(err);
    }
  });

  $("specialsSave").addEventListener("click", async () => {
    const status = $("specialsStatus");
    status.textContent = 'Guardando...'; status.className = 'sheets-status';
    try {
      if (!_specialsBaseline) {
        const server = (await gmApi('/gm/specials') || []).map(parseSpecialFromRow);
        adoptSpecialIds(_specials, server);
        setSpecialsBaseline(server);
      }
      const currentIds = new Set(_specials.filter(e => e.id !== undefined).map(e => e.id));
      const toDelete = [..._specialsLoadedIds].filter(id => !currentIds.has(id));
      const changed = _specials.some(e => e.id === undefined || _specialsBaseline.get(e.id) !== specialCanon(e));
      if (!toDelete.length && !changed) {
        status.textContent = 'No hay cambios que guardar';
        status.className = 'sheets-status';
        return;
      }
      if (toDelete.length) {
        const names = toDelete.map(id => JSON.parse(_specialsBaseline.get(id)).label || `#${id}`);
        if (!await customConfirm(`Se eliminarán ${toDelete.length} evento(s) de Supabase: ${namesList(names)}.`, { ok: 'Guardar y eliminar', okDanger: true })) {
          status.textContent = '';
          return;
        }
      }
      const toRow = ev => ({ date: ev.date, date_to: ev.dateTo || null, label: ev.label, name: ev.name, color: ev.color, tag: ev.tag || null, game_ids: ev.gameIds || [], search: ev.search || null });
      const withId    = _specials.filter(e => e.id !== undefined).map(ev => ({ ...toRow(ev), id: ev.id }));
      const withoutId = _specials.filter(e => e.id === undefined).map(toRow);
      // El worker borra, actualiza e inserta, y devuelve la lista ya guardada (con los ids nuevos)
      const refreshed = await gmApi('/gm/specials', { deleteIds: toDelete, update: withId, insert: withoutId });
      _specials = (refreshed || []).map(parseSpecialFromRow);
      setSpecialsBaseline(_specials);
      _specialsLoaded = true;
      renderSpecials();
      setSpecialsDirty(false);
      status.textContent = `✓ ${_specials.length} eventos guardados`;
      status.className = 'sheets-status ok';
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
      status.className = 'sheets-status error';
      console.error(err);
    }
  });

  // Archivo specials.js: se ejecuta para leer SPECIAL_EVENTS (es un archivo del propio proyecto)
  $("specialsUpload").addEventListener("click", () => $("specialsFileInput").click());
  $("specialsFileInput").addEventListener("change", async e => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    const status = $("specialsStatus");
    try {
      const text = await file.text();
      // eslint-disable-next-line no-new-func
      const events = new Function(text.replace(/if\s*\(typeof\s+module[^\n]*/g, '') + '; return SPECIAL_EVENTS;')();
      if (!Array.isArray(events)) throw new Error('no se ha encontrado SPECIAL_EVENTS');
      const list = events.map(ev => ({
        date: String(ev.date || ''), dateTo: String(ev.dateTo || ''), label: String(ev.label || ''),
        name: String(ev.name || ''), color: String(ev.color || '#888888'), tag: String(ev.tag || ''),
        gameIds: Array.isArray(ev.gameIds) ? ev.gameIds.map(Number).filter(n => n > 0) : [],
        search: String(ev.search || ''),
      }));
      adoptSpecialIds(list, _specials);
      _specials = list;
      renderSpecials();
      setSpecialsDirty(true);
      status.textContent = `✓ ${list.length} eventos leídos de ${file.name} (sin guardar)`;
      status.className = 'sheets-status ok';
    } catch (err) {
      status.textContent = 'Error al leer el archivo: ' + err.message;
      status.className = 'sheets-status error';
    }
  });

  $("specialsDownload").addEventListener("click", () => {
    downloadRaw('specials.js', generateSpecialsJs(), 'text/javascript;charset=utf-8');
    $("specialsStatus").textContent = '✓ specials.js descargado';
    $("specialsStatus").className = 'sheets-status ok';
    setTabDiff('especiales', false);
  });

  // Buscador de IDs de juegos para la pestaña de especiales
  $("spIdSearch").addEventListener("input", () => {
    const q = $("spIdSearch").value.trim().toLowerCase();
    const results = $("spIdResults");
    if (!q || db.length === 0) { results.innerHTML = ''; return; }
    const matches = db.filter(item => item.game.toLowerCase().includes(q)).slice(0, 20);
    results.innerHTML = matches.map(item =>
      `<span class="sp-id-chip" title="Clic para copiar ID ${item.id}"><strong>${item.id}</strong> ${escapeHtml(item.game)}</span>`
    ).join('');
  });

  $("spIdResults").addEventListener("click", e => {
    const chip = e.target.closest('.sp-id-chip');
    if (!chip) return;
    const id = chip.querySelector('strong')?.textContent;
    if (id) navigator.clipboard?.writeText(id);
  });

})();
</script>
</body>
</html>
