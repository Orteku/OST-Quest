<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tu perfil de Oesti Quest — estadísticas, logros y ajustes de cuenta.">
  <title>Perfil — Oesti Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="48x48" href="img/logo.png">
  <link rel="canonical" href="https://oestiquest.com/profile.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7677038770205132" crossorigin="anonymous"></script>
</head>
<body>
<script>if(localStorage.getItem('ostquest_theme')==='light')document.body.classList.add('theme--light');</script>
<script>
  window.PROFILE_PAGE     = true;
  document.addEventListener('langchange', () => {
    if (typeof t === 'function') document.title = t('profile_page_title') || 'Perfil — Oesti Quest';
  });
</script>

<div class="site-header-wrap" id="site-header">
  </div><!-- /.site-header-wrap -->

<div class="app-wrapper">

  <div id="site-controls"></div>


  <!-- Contenido -->
  <div class="profile-wrap">

    <!-- Tarjeta de perfil + cajón de ajustes -->
    <div class="pcard-group">
      <div id="profile-card">
        <!-- Poblado por auth.js -->
      </div>
      <div class="pcard-drawer" id="pcard-drawer">
        <div class="pcard-drawer__panel" id="profile-settings-panel">
          <div id="profile-settings">
            <!-- Poblado por auth.js -->
          </div>
        </div>
        <button class="pcard-drawer__toggle" id="profile-settings-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="profile_settings_section">Ajustes de la cuenta</span>
          <svg class="pcard-drawer__chevron" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="12" height="12"><path d="M1 1l4 4 4-4"/></svg>
        </button>
      </div>
    </div>

    <!-- Logros -->
    <section>
      <p class="profile-section-heading" data-i18n="profile_achievements_section">Trofeos</p>
      <div class="ach-filter-row">
        <p class="profile-section-sub" data-i18n="profile_achievements_sub">Selecciona qué trofeo lucir en tu avatar</p>
        <div class="ach-controls">
          <div class="seg" role="group" id="ach-view" data-i18n-aria="ach_view_label" aria-label="Vista">
            <button type="button" class="seg__btn seg__btn--icon" data-view="compact" data-i18n-aria="ach_view_compact" aria-label="Compacta" title="Compacta">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
            </button>
            <button type="button" class="seg__btn seg__btn--icon" data-view="detailed" data-i18n-aria="ach_view_detailed" aria-label="Detallada" title="Detallada">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><rect x="1" y="1.5" width="3.5" height="3.5" rx="1"/><rect x="6.5" y="2.25" width="8.5" height="2" rx="1"/><rect x="1" y="6.25" width="3.5" height="3.5" rx="1"/><rect x="6.5" y="7" width="8.5" height="2" rx="1"/><rect x="1" y="11" width="3.5" height="3.5" rx="1"/><rect x="6.5" y="11.75" width="8.5" height="2" rx="1"/></svg>
            </button>
          </div>
          <label class="ach-filter">
            <span data-i18n="ach_only_unlocked">Solo conseguidos</span>
            <input type="checkbox" id="ach-only-unlocked" class="switch-input" role="switch">
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>
      </div>
      <div id="achievements-grid" class="achievements-grid">
        <!-- Poblado por auth.js -->
      </div>
    </section>

  </div>

  <footer class="site-footer" id="site-footer" style="margin-top:32px"></footer>

</div>

<div id="modal" role="dialog" aria-modal="true">
  <div id="modal-inner"></div>
</div>
<div id="auth-modal" role="dialog" aria-modal="true">
  <div id="auth-modal-inner"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/specials.js"></script>
<script src="js/achievements.js"></script>
<script src="js/daily.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
</body>
</html>
