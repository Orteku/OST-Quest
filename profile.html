<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

<body>
<script>if(localStorage.getItem('ostquest_theme')==='light')document.body.classList.add('theme--light');</script>
<script>
  window.PROFILE_PAGE     = true;
  document.addEventListener('langchange', () => {
    if (typeof t === 'function') document.title = t('profile_page_title') || 'Perfil — Oesti Quest';
  });
</script>

<div class="site-header-wrap" id="site-header">
  </div><!-- /.site-header-wrap -->

<div class="app-wrapper">

  <div id="site-controls"></div>


  <!-- Contenido -->
  <div class="profile-wrap">

    <!-- Tarjeta de perfil + cajón de ajustes -->
    <div class="pcard-group">
      <div id="profile-card">
        <!-- Poblado por auth.js -->
      </div>
      <div class="pcard-drawer" id="pcard-drawer">
        <div class="pcard-drawer__panel" id="profile-settings-panel">
          <div id="profile-settings">
            <!-- Poblado por auth.js -->
          </div>
        </div>
        <button class="pcard-drawer__toggle" id="profile-settings-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="profile_settings_section">Ajustes de la cuenta</span>
          <svg class="pcard-drawer__chevron" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="12" height="12"><path d="M1 1l4 4 4-4"/></svg>
        </button>
      </div>
    </div>

    <!-- Logros -->
    <section>
      <p class="profile-section-heading" data-i18n="profile_achievements_section">Trofeos</p>
      <p class="profile-section-sub" data-i18n="profile_achievements_sub">Selecciona qué trofeo lucir en tu avatar</p>
      <div id="achievements-grid" class="achievements-grid">
        <!-- Poblado por auth.js -->
      </div>
    </section>

  </div>

  <footer class="site-footer" style="margin-top:32px">
    <p data-i18n-html="footer_credit_legal">Música provista por <a href="https://archive.org" target="_blank" rel="noopener">Archive.org</a> y <a href="https://downloads.khinsider.com" target="_blank" rel="noopener">KHInsider</a> · Desarrollado por Orteku en colaboración con Vyrka · <a href="privacy.html">Privacidad</a> · <a href="terms.html">Términos</a></p>
  </footer>

</div>

  <div id="modal-inner"></div>
